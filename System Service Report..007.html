<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <title>Atul Auto Form</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url( "Background.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    .popup-form {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 20px;
      max-width: 400px;
      margin: 130px auto;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      text-align: center;
    }

    input, textarea {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 20px;
      background-color: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    #hidden-photo {
      display: none;
      margin-top: 20px;
    }

    #hidden-photo img {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>
 	
  <div class="popup-form">
    <h2>સંપર્ક કરો</h2><h2>
    <input type="text" placeholder="તમારું નામ" required><br>
    <input type="tel" placeholder="મોબાઇલ નંબર"><br>
    <textarea placeholder="સંદેશ"></textarea><br>

    <!-- Simple CAPTCHA -->
    <label for="captcha">Captcha લખો: 4 + 6 = ?</label><br>
    <input type="text" id="captcha" placeholder="તમારો જવાબ લખો"><br>
    <button onclick="checkCaptcha()">મોકલો</button>

    <div id="hidden-photo">
      <h3>આ છે તમારો  ફોટો:</h3>
      <img src="24092025.jpg" alt="Jayesh"/>
    </div>
  </div>

  <script>
    function checkCaptcha() {
      const captcha = document.getElementById("captcha").value;
      if (captcha.trim() === "10") {
        document.getElementById("hidden-photo").style.display = "block";
      } else {
        alert("માફ કરો, CAPTCHA ખોટો છે!");
      }
    }
  </script>

</body>
</html>
